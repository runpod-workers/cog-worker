name: CD | Dev Docker Image

on:
  push:
    branches-ignore:
      - "refs/tags/*"

jobs:
  docker:
    # The Dockerfile builds FROM a Replicate (cog) model, so it needs all three
    # COG_* build args. This repo is a template with no model of its own: set
    # COG_REPO, COG_MODEL and COG_VERSION as repository variables in a fork to
    # build, otherwise the job is skipped instead of failing.
    if: vars.COG_REPO != '' && vars.COG_MODEL != '' && vars.COG_VERSION != ''
    runs-on: ubuntu-latest
    steps:
      - name: Clear Space
        run: |
          rm -rf /usr/share/dotnet
          rm -rf /opt/ghc
          rm -rf "/usr/local/share/boost"
          rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "DOCKER_TAG=dev" >> $GITHUB_ENV
          else
            echo "DOCKER_TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_REPO }}/${{ vars.DOCKERHUB_IMG }}:${{ env.DOCKER_TAG }}
          build-args: |
            COG_REPO=${{ vars.COG_REPO }}
            COG_MODEL=${{ vars.COG_MODEL }}
            COG_VERSION=${{ vars.COG_VERSION }}
